[project]
name = "teille-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "coverage>=7.4"]
# The converter, for a machine that only runs batches. teille-sync calls
# `teille-douce` as a subprocess and never imports it, so a snapshot in
# site-packages behaves exactly like a local checkout — the difference is
# only that edits to it stop counting. Anyone developing the converter
# installs it editable instead and leaves this extra alone.
#
# Pinned to a tag, not a branch: every batch records its `Version
# pipeline` on the board, and a moving ref would make two machines
# installed a week apart disagree with nothing saying so. Moving to a new
# converter is a deliberate edit of this line.
#
# pip caches git URLs, so picking up a retagged or newer converter needs
# `--force-reinstall`; changing the tag here is enough on a fresh install.
converter = [
    "teille-douce[ner] @ git+https://github.com/Grand-Siecle/TEIlle-douce.git@v2.0.0",
]

[project.scripts]
teille-sync = "teille_sync.cli:main"

# Without this, setuptools' flat-layout autodiscovery walks the working
# directory and refuses to build as soon as a run has been done here:
# `work/` and `entities/` land beside `teille_sync/` and it sees three
# top-level packages. The failure is `Multiple top-level packages
# discovered in a flat-layout`, and it means teille-sync cannot be
# reinstalled on a machine that has already used it.
[tool.setuptools.packages.find]
include = ["teille_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
